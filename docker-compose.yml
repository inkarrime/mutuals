services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mutuals
      POSTGRES_USER: mutuals
      POSTGRES_PASSWORD: mutuals
    ports:
      - "5433:5432"
    volumes:
      - mutuals-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mutuals"]
      interval: 5s
      retries: 10

  mail:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:postgresql://db:5432/mutuals
      MAIL_HOST: mail
      MAIL_PORT: 1025
    ports:
      - "${APP_PORT:-8080}:8080"
    profiles:
      - full

volumes:
  mutuals-db:
