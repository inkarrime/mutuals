<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${subject}">Mutuals</title>
</head>
<body style="margin:0;padding:0;background:#f6f3ee;font-family:Arial,Helvetica,sans-serif;color:#1f1a17;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f3ee;padding:32px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:16px;padding:32px;">
                <tr>
                    <td style="font-size:22px;font-weight:bold;color:#ff5a1f;padding-bottom:16px;">Mutuals</td>
                </tr>
                <tr>
                    <td style="font-size:18px;font-weight:bold;padding-bottom:12px;" th:text="|¡Gracias por unirte a Mutuals Plus, ${name}!|">Mutuals Plus</td>
                </tr>
                <tr>
                    <td style="font-size:15px;line-height:1.6;padding-bottom:16px;">
                        Ya tienes rachas ilimitadas, un escudo gratis cada mes, temas y widgets exclusivos y tu Wrapped histórico completo.
                        <div th:text="|Tu suscripción está activa hasta el ${expiresAt}.|">Vigencia</div>
                    </td>
                </tr>
                <tr>
                    <td style="font-size:12px;color:#8a817a;padding-top:24px;border-top:1px solid #eee;">
                        Recibes este correo porque tienes una cuenta en Mutuals. Puedes desactivar los correos en Preferencias.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
